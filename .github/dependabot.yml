# Keeps the two things that can actually pull in outside code up to date:
# the one devDependency (wrangler) and the third-party GitHub Actions.
#
# The Actions in refresh-cards.yml are pinned to commit SHAs rather than moving
# tags like `v4` — a tag can be repointed at new code by whoever owns it, and
# that workflow runs with write access to this repo and access to its secrets.
# Dependabot understands SHA pins and will open PRs bumping them, with the
# version in the trailing comment, so pinning doesn't mean going stale.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
